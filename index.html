<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <title>view a mindustry map</title>
    <style>
        img {
            user-select: none;
            image-rendering: crisp-edges;
        }

        body {
            background-color: #3e3b3b;
            padding: 0px;
            margin: 0px;
        }

        #icon {
            z-index: 2;
            pointer-events: none;
            background-color: #3e3b3b96;
            margin: 5px !important;
            position: absolute;
            cursor: progress;
        }

        #icon,
        input {
            height: 64px;
            width: 64px;
            position: absolute;
            margin: 5px;
            border-radius: 5px;
            border: 4px outset #fbd367;
        }

        input {
            opacity: 0;
            cursor: progress;
            z-index: 1;
        }

        path {
            transition: 0.25s cubic-bezier(0.68, -0.55, 0.27, 1.55) all;
        }
    </style>
</head>
